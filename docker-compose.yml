services:
  api:
    platform: linux/amd64
    build:
      context: .
    image: portfolio-api
    ports:
      - "8000:8000"
      - "11435:11434"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_MODEL: LLAMA_1B
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
