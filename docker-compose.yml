services:
  api:
    platform: linux/amd64
    build:
      context: .
    image: portfolio-api
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_MODEL: GEMMA4_31B
      OLLAMA_BASE_URL: https://ollama.com/v1
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
