[project]
name = "portfolio-api"
version = "0.1.0"
description = "API backend for portfolio using FastAPI and Ollama."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "ollama>=0.1.0",
    "pydantic>=1.10.7",
    "pytest>=7.2.2"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services like Ollama"
]
