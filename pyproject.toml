[project]
name = "portfolio-api"
version = "0.1.0"
description = "API backend for portfolio using FastAPI and Ollama."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "ollama>=0.1.0",
    "openai>=0.1.0",
    "pydantic>=1.10.7",
    "pytest>=7.2.2",
    "pytest-asyncio>=0.20.3",
    "selenium>=4.10.0",
    "playwright>=1.38.0",
    "webdriver-manager>=3.8.5",
    "urllib3>=1.26.15",
    "redis>=5.0.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services like Ollama"
]

[tool.setuptools.packages.find]
exclude = ["demos*"]

[project.scripts]
portfolio-api = "uvicorn.main:main"
